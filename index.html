<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4x4 ArUco生ビット検証ツール（ライブラリ不使用）</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: monospace; text-align: center; }
        
        /* 牧平さんの指示に基づき、UIパネルは手で隠れないよう最上部に固定 */
        #ui-panel { 
            background: #222; 
            padding: 15px; 
            border-bottom: 2px solid #444; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .btn { 
            padding: 14px 28px; 
            font-size: 16px; 
            font-weight: bold; 
            background: #009688; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer;
        }
        .btn:active { background: #00796b; }
        
        .camera-container { 
            position: relative; 
            width: 100%; 
            max-width: 480px; 
            margin: 10px auto; 
        }
        video { width: 100%; display: block; background: #000; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        #result-panel { 
            background: #000; 
            color: #00ff00; 
            text-align: left; 
            padding: 15px; 
            max-width: 450px; 
            margin: 10px auto; 
            border: 1px solid #333; 
            font-size: 16px; 
            line-height: 1.4;
        }
        .matrix-display { font-size: 20px; letter-spacing: 4px; margin: 10px 0; line-height: 1.2; }
    </style>
</head>
<body>

<div id="ui-panel">
    <button class="btn" onclick="captureMarkerBits()">この瞬間のビット抽出を実行</button>
</div>

<div class="camera-container">
    <video id="video" playsinline muted></video>
    <canvas id="canvas-overlay"></canvas>
</div>

<div id="result-panel">
    <div>【解析結果】</div>
    <div id="bit-matrix" class="matrix-display">枠内にマーカーを合わせてボタンを押してください</div>
    <hr style="border-color:#333;">
    <div id="bit-string">生データ: --</div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas-overlay');
const ctx = canvas.getContext('2d');

const ROI_SIZE = 240; // 解析する正方形のサイズ（ピクセル）
let roiX = 0;
let roiY = 0;

window.onload = async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        video.play();
        
        // メイン描画ループ（ガイド枠のリアルタイム表示）
        function drawLoop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                if (canvas.width !== video.videoWidth) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    // 画面中央に配置
                    roiX = (canvas.width - ROI_SIZE) / 2;
                    roiY = (canvas.height - ROI_SIZE) / 2;
                }
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 1. 画面中央の正方形ターゲット枠（ROI）を描画
                ctx.strokeStyle = "red";
                ctx.lineWidth = 4;
                ctx.strokeRect(roiX, roiY, ROI_SIZE, ROI_SIZE);
                
                // 2. 6x6のサンプリングポイント（グリッド）をうっすら視覚化
                ctx.fillStyle = "rgba(0, 255, 255, 0.5)";
                const cellSize = ROI_SIZE / 6;
                for (let r = 0; r < 6; r++) {
                    for (let c = 0; c < 6; c++) {
                        const ptX = roiX + (c * cellSize) + (cellSize / 2);
                        const ptY = roiY + (r * cellSize) + (cellSize / 2);
                        ctx.fillRect(ptX - 2, ptY - 2, 4, 4);
                    }
                }
            }
            requestAnimationFrame(drawLoop);
        }
        requestAnimationFrame(drawLoop);
    } catch (e) {
        alert("カメラ起動エラー: " + e.message);
    }
};

// 外部ライブラリを一切使わずに、Canvas上のピクセルから直接4x4（+外枠）のビットを判定する関数
function captureMarkerBits() {
    if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

    // 一時的な解析用Canvasを作成
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = video.videoWidth;
    tempCanvas.height = video.videoHeight;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

    // ターゲット枠（ROI）内のピクセルデータを一括取得
    const imgData = tempCtx.getImageData(roiX, roiY, ROI_SIZE, ROI_SIZE);
    const data = imgData.data;

    const cellSize = ROI_SIZE / 6;
    const brightnessGrid = [];
    let maxB = 0;
    let minB = 255;

    // 各セルの中心点（周囲3x3ピクセルの平均）から輝度を抽出
    for (let r = 0; r < 6; r++) {
        brightnessGrid[r] = [];
        for (let c = 0; c < 6; c++) {
            const centerX = Math.floor((c * cellSize) + (cellSize / 2));
            const centerY = Math.floor((r * cellSize) + (cellSize / 2));
            
            let sumLuma = 0;
            let count = 0;
            
            // 中心点の周辺ピクセルをサンプリングしてノイズを軽減
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    const px = (centerY + dy) * ROI_SIZE + (centerX + dx);
                    const idx = px * 4;
                    if (idx >= 0 && idx < data.length) {
                        const rVal = data[idx];
                        const gVal = data[idx+1];
                        const bVal = data[idx+2];
                        // 標準的な輝度変換（Luma）
                        const luma = 0.299 * rVal + 0.587 * gVal + 0.114 * bVal;
                        sumLuma += luma;
                        count++;
                    }
                }
            }
            
            const avgLuma = sumLuma / count;
            brightnessGrid[r][c] = avgLuma;
            
            if (avgLuma > maxB) maxB = avgLuma;
            if (avgLuma < minB) minB = avgLuma;
        }
    }

    // 動的二値化のためのしきい値を決定（枠内の最大・最小輝度の中間値）
    const threshold = (maxB + minB) / 2;

    // 6x6のビットマップを生成 (0: 黒, 1: 白)
    const bitGrid = [];
    for (let r = 0; r < 6; r++) {
        bitGrid[r] = [];
        for (let c = 0; c < 6; c++) {
            bitGrid[r][c] = (brightnessGrid[r][c] > threshold) ? 1 : 0;
        }
    }

    // 画面表示用の成形
    let matrixHTML = "";
    let rawBitStrings = [];

    // 内側の4x4データ領域のみを抽出
    for (let r = 1; r <= 4; r++) {
        let rowString = "";
        for (let c = 1; c <= 4; c++) {
            const bit = bitGrid[r][c];
            matrixHTML += (bit === 1) ? "□" : "■"; // 1が白、0が黒
            rowString += bit;
        }
        matrixHTML += "<br>";
        rawBitStrings.push(rowString);
    }

    // 結果パネルの更新
    document.getElementById('bit-matrix').innerHTML = matrixHTML;
    document.getElementById('bit-string').innerText = "4x4生ビット列:\n" + rawBitStrings.join("\n");

    // 簡易的な外枠チェック（マーカーとして正しく収まっているかの簡易判定）
    let isOuterValid = true;
    // 上下の行が黒枠（0）かチェック
    for(let c=0; c<6; c++) { if(bitGrid[0][c] === 1 || bitGrid[5][c] === 1) isOuterValid = false; }
    // 左右の列が黒枠（0）かチェック
    for(let r=0; r<6; r++) { if(bitGrid[r][0] === 1 || bitGrid[r][5] === 1) isOuterValid = false; }

    if (!isOuterValid) {
        document.getElementById('bit-string').innerText += "\n\n【注意】外枠が正しく黒で認識されていません。マーカーを赤い枠線へ正確に平行に近づけてください。";
    }
}
</script>
</body>
</html>
