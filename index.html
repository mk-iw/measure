<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArUco環境検証テスト</title>
    <script async src="https://docs.opencv.org/4.5.2/opencv.js" onload="onCvReady();"></script>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
        #info { background: #222; padding: 15px; font-size: 16px; border-bottom: 2px solid #444; }
        video { width: 100%; max-width: 640px; display: block; margin: 10px auto; background: #000; }
        canvas { width: 100%; max-width: 640px; display: block; margin: 10px auto; background: #000; }
        .btn { padding: 12px 24px; font-size: 18px; font-weight: bold; background: #009688; color: white; border: none; border-radius: 6px; margin: 10px; }
    </style>
</head>
<body>

<div id="info">
    【ステータス】<br>
    OpenCV.js: <span id="status-cv" style="color:red; font-weight:bold;">Loading...</span><br>
    検知されたマーカー数: <span id="status-count" style="color:yellow; font-size:20px; font-weight:bold;">0 個</span>
</div>

<button class="btn" onclick="runSingleTest()">このコマで検知テストを実行</button>

<p>【1. カメラ生映像】</p>
<video id="video" playsinline></video>

<p>【2. OpenCV解析直後の映像（成否チェック用）】</p>
<canvas id="canvas-out"></canvas>

<script>
let cvReady = false;
const video = document.getElementById('video');
const canvas = document.getElementById('canvas-out');
const ctx = canvas.getContext('2d');

function onCvReady() {
    cvReady = true;
    document.getElementById('status-cv').innerText = "OK (動作可能)";
    document.getElementById('status-cv').style.color = "lightgreen";
}

window.onload = async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: {ideal: 1280}, height: {ideal: 720} }
        });
        video.srcObject = stream;
        video.play();
        
        function drawLoop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                if(canvas.width !== video.videoWidth) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }
                // ボタンを押すまでは、下のCanvasにも生映像をそのまま流す
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }
            requestAnimationFrame(drawLoop);
        }
        requestAnimationFrame(drawLoop);
    } catch (e) {
        alert("カメラ起動エラー: " + e.message);
    }
};

function runSingleTest() {
    if (!cvReady) { alert("ライブラリの読み込みが完了していません。"); return; }
    
    // テスト実行時の1コマを固定描画
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    
    // OpenCVのメモリ管理オブジェクト
    let src = new cv.Mat();
    let dst = new cv.Mat();
    let markerIds = new cv.Mat();
    let markerCorners = new cv.MatVector();
    
    try {
        // 【バグ修正1】スマホ環境でクラッシュしないよう、第一引数に空のMat（src）を明示的に渡して初期化
        cv.matFromImageData(imgData, src);
        cv.cvtColor(src, dst, cv.COLOR_RGBA2RGB, 0);

        let dictionary = cv.getPredefinedDictionary(cv.DICT_4X4_50);
        let parameter = new cv.DetectorParameters();

        // 検出処理を実行
        cv.detectMarkers(dst, dictionary, markerCorners, markerIds, parameter);

        const count = markerIds.rows;
        document.getElementById('status-count').innerText = `${count} 個`;

        if (count > 0) {
            document.getElementById('status-count').style.color = "lightgreen";
            
            // 検知した位置にCanvas上で枠を描画
            for (let i = 0; i < count; i++) {
                // 【バグ修正2】iOS/Androidでのメモリ参照エラーを防ぐため、正式なメソッド経由で座標を抽出
                let mat = markerCorners.get(i);
                let x0 = mat.data32F[0], y0 = mat.data32F[1];
                let x1 = mat.data32F[2], y1 = mat.data32F[3];
                let x2 = mat.data32F[4], y2 = mat.data32F[5];
                let x3 = mat.data32F[6], y3 = mat.data32F[7];

                ctx.strokeStyle = "#00ffff";
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineTo(x3, y3);
                ctx.closePath();
                ctx.stroke();
                
                ctx.fillStyle = "red";
                ctx.font = "bold 30px sans-serif";
                ctx.fillText(`ID:${markerIds.data32S[i]}`, x0, y0 - 10);
            }
        } else {
            document.getElementById('status-count').style.color = "red";
            alert("マーカーが検出されませんでした。画角や距離を変えてもう一度お試しください。");
        }

    } catch (error) {
        alert("内部解析エラー発生: " + error.message);
    } finally {
        // メモリリーク防止のため、エラーの有無に関わらず確実にメモリを解放
        src.delete(); dst.delete(); markerIds.delete(); markerCorners.delete();
    }
}
</script>
</body>
</html>
