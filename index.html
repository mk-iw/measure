<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4x4 ArUco環境検証テスト（読み込み修正版）</title>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/vendor/jsartoolkit5/build/artoolkit.min.js" onload="onLibReady();"></script>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
        #info { background: #222; padding: 15px; font-size: 16px; border-bottom: 2px solid #444; }
        video { width: 100%; max-width: 640px; display: block; margin: 10px auto; background: #000; }
        canvas { width: 100%; max-width: 640px; display: block; margin: 10px auto; background: #000; }
        .btn { padding: 12px 24px; font-size: 18px; font-weight: bold; background: #009688; color: white; border: none; border-radius: 6px; margin: 10px; }
    </style>
</head>
<body>

<div id="info">
    【ステータス】<br>
    ARエンジン: <span id="status-lib" style="color:red; font-weight:bold;">Loading...</span><br>
    検知された4x4マーカー数: <span id="status-count" style="color:yellow; font-size:24px; font-weight:bold;">0 個</span>
</div>

<button class="btn" onclick="runSingleTest()">このコマで4x4検知テストを実行</button>

<p>【1. カメラ生映像】</p>
<video id="video" playsinline></video>

<p>【2. 解析結果】</p>
<canvas id="canvas-out"></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas-out');
const ctx = canvas.getContext('2d');
let arController = null;
let isLibReady = false;

// ブラウザの負荷ゼロで、ライブラリの準備が整った瞬間を1回だけ検知する関数
function onLibReady() {
    isLibReady = true;
    document.getElementById('status-lib').innerText = "OK (4x4対応エンジン起動)";
    document.getElementById('status-lib').style.color = "lightgreen";
}

window.onload = async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: {ideal: 1280}, height: {ideal: 720} }
        });
        video.srcObject = stream;
        video.play();
        
        function drawLoop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                if(canvas.width !== video.videoWidth) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }
                if (!window.isTesting) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                }
            }
            requestAnimationFrame(drawLoop);
        }
        requestAnimationFrame(drawLoop);
    } catch (e) {
        alert("カメラ起動エラー: " + e.message);
    }
};

function runSingleTest() {
    if (!isLibReady) { alert("ARエンジンがまだ読み込まれていません。"); return; }
    window.isTesting = true;
    
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    try {
        if (!arController) {
            arController = new ARController(canvas.width, canvas.height, null);
            arController.setPatternDetectionMode(artoolkit.AR_MATRIX_CODE_DETECTION);
            arController.setMatrixCodeType(artoolkit.AR_MATRIX_CODE_4x4);
        }

        arController.detectMarker(canvas);
        
        const count = arController.getMarkerNum();
        document.getElementById('status-count').innerText = `${count} 個`;

        if (count > 0) {
            document.getElementById('status-count').style.color = "lightgreen";
            
            for (let i = 0; i < count; i++) {
                let markerInfo = arController.getMarker(i);
                let vertex = markerInfo.vertex; 
                
                ctx.strokeStyle = "#00ffff";
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(vertex[0][0], vertex[0][1]);
                ctx.lineTo(vertex[1][0], vertex[1][1]);
                ctx.lineTo(vertex[2][0], vertex[2][1]);
                ctx.lineTo(vertex[3][0], vertex[3][1]);
                ctx.closePath();
                ctx.stroke();
                
                ctx.fillStyle = "red";
                ctx.font = "bold 35px sans-serif";
                ctx.fillText(`ID:${markerInfo.idMatrix}`, vertex[0][0], vertex[0][1] - 15);
            }
            alert(`正常に解析完了：4x4マーカーが ${count} 個 検知されました。`);
        } else {
            document.getElementById('status-count').style.color = "red";
            alert("解析は正常に完了しましたが、4x4マーカーは検出されませんでした。");
        }

    } catch (error) {
        alert("エラーが発生しました: " + error.message);
    } finally {
        setTimeout(() => { window.isTesting = false; }, 500);
    }
}
</script>
</body>
</html>
