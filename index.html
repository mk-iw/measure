<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魚体計測システム</title>

    <!-- OpenCVは遅延読込 -->
    <script>
        function loadOpenCv() {
            return new Promise((resolve) => {
                if (window.cv) {
                    resolve();
                    return;
                }

                const script = document.createElement('script');
                script.src = "https://docs.opencv.org/4.5.2/opencv.js";

                script.onload = () => {
                    cv['onRuntimeInitialized'] = () => {
                        console.log("OpenCV Ready");
                        resolve();
                    };
                };

                document.head.appendChild(script);
            });
        }
    </script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        .controls {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            z-index: 1000;
            pointer-events: none;
        }

        button {
            flex: 1;
            margin: 5px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #btn-ratio { background: #555; color: white; }
        #btn-test { background: #009688; color: white; }
        #btn-cancel { background: #666; color: white; display: none; }
        #btn-hold { background: #2196F3; color: white; }
        #btn-save { background: #ff4444; color: white; display: none; }
    </style>
</head>

<body>

<div class="controls">
    <button id="btn-ratio" onclick="toggleRatioUI()">倍率調整</button>
    <button id="btn-test" onclick="testArUcoNow()">ArUcoテスト</button>
    <button id="btn-cancel" onclick="toggleHold(false)">キャンセル</button>
    <button id="btn-hold" onclick="toggleHold(true)">ホールド</button>
    <button id="btn-save" onclick="finalizeAndSave()">保存</button>
</div>

<video id="video" style="display:none" playsinline></video>
<canvas id="canvas-measure"></canvas>

<script>

let currentNo = 1;
let tankId = "1";
let mmRatio = 0.400;

let isHolding = false;
let activePoint = null;

let cvReady = false;

let detectedArUcoPoints = [];
let globalCorners = {};

let testDisplayTimer = null;
let arucoStatusText = "ArUco: Ready";

let printScale = 0.707;

let isWarped = false;

const warpedCanvas = document.createElement('canvas');

const lastCapturedFrame = document.createElement('canvas');
lastCapturedFrame.width = 1280;
lastCapturedFrame.height = 720;

const lctx = lastCapturedFrame.getContext('2d', { alpha: false });

const offscreen = document.createElement('canvas');
const octx = offscreen.getContext('2d', { willReadFrequently: true });

let points = {
    p1: {x: 300, y: 360, label: "口先"},
    p2: {x: 900, y: 360, label: "尾叉"}
};

const video = document.getElementById('video');
const canvas = document.getElementById('canvas-measure');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener('resize', resizeCanvas);

window.addEventListener('DOMContentLoaded', async () => {

    resizeCanvas();

    tankId = prompt("水槽番号", "1") || "1";
    currentNo = parseInt(prompt("開始No.", "001")) || 1;

    try {

        const s = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment",
                width: {ideal: 1280},
                height: {ideal: 720}
            }
        });

        video.srcObject = s;

        await video.play();

        renderLoop();

    } catch (e) {
        console.error(e);
        alert("カメラエラー");
    }

    initTouchEvents();

    window.addEventListener('click', initVoiceRecognition, { once: true });

});

function initVoiceRecognition() {

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) return;

    const recognition = new SpeechRecognition();

    recognition.lang = 'ja-JP';
    recognition.continuous = true;

    recognition.onresult = (event) => {

        const result = event.results[event.results.length - 1][0].transcript;

        if (result.includes("ホールド") || result.includes("ストップ")) {
            if (!isHolding) toggleHold(true);
        }
        else if (result.includes("保存")) {
            if (isHolding) finalizeAndSave();
        }
        else if (result.includes("キャンセル") || result.includes("リセット")) {
            if (isHolding) toggleHold(false);
        }
    };

    recognition.onend = () => recognition.start();

    recognition.start();
}

function renderLoop() {
    render();
    requestAnimationFrame(renderLoop);
}

function render() {

    const stageW = canvas.width;
    const stageH = canvas.height;

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, stageW, stageH);

    const baseW = (isHolding && isWarped) ? warpedCanvas.width : 1280;
    const baseH = (isHolding && isWarped) ? warpedCanvas.height : 720;

    let scale = Math.min(stageW / baseW, stageH / baseH);

    if (isHolding && isWarped) scale *= 0.95;

    const ox = (stageW - baseW * scale) / 2;
    const oy = (stageH - baseH * scale) / 2;

    const imgToDraw = isHolding
        ? (isWarped ? warpedCanvas : lastCapturedFrame)
        : video;

    ctx.drawImage(imgToDraw, ox, oy, baseW * scale, baseH * scale);

    const fSize = canvas.height / 30;

    if (!isHolding || !isWarped) {

        detectedArUcoPoints.forEach((p) => {

            ctx.strokeStyle = "#00ffff";
            ctx.lineWidth = 5;

            ctx.strokeRect(
                ox + (p.x - 40) * scale,
                oy + (p.y - 40) * scale,
                80 * scale,
                80 * scale
            );
        });
    }

    // ===== 警告 =====

    if (arucoStatusText.startsWith("警告")) {

        ctx.fillStyle = "red";
        ctx.font = "bold 80px sans-serif";
        ctx.textAlign = "center";

        ctx.fillText(
            arucoStatusText,
            stageW / 2,
            stageH / 2
        );
    }

    // ===== 結果表示（少し左上へ修正）=====

    if (isHolding && mmRatio > 0) {

        const forkPx = Math.hypot(
            points.p2.x - points.p1.x,
            points.p2.y - points.p1.y
        );

        const sizeCm = (forkPx * mmRatio / 10).toFixed(1);

        ctx.font = "bold 60px sans-serif";

        const metrics = ctx.measureText(sizeCm + " cm");

        const boxW = metrics.width + 80;
        const boxH = 100;

        // 修正：さらに左上へ
        const boxX = stageW - boxW/2 - 220;
        const boxY = stageH - boxH/2 - 220;

        ctx.fillStyle = "white";

        ctx.fillRect(
            boxX - boxW/2,
            boxY - boxH/2,
            boxW,
            boxH
        );

        ctx.strokeStyle = "red";
        ctx.lineWidth = 6;

        ctx.strokeRect(
            boxX - boxW/2,
            boxY - boxH/2,
            boxW,
            boxH
        );

        ctx.fillStyle = "black";
        ctx.textAlign = "center";

        ctx.fillText(
            sizeCm + " cm",
            boxX,
            boxY + 20
        );
    }

    // ===== 下部ステータス表示へ移動 =====

    const marginL = 40;

    drawStyledText(
        `水槽${tankId} No.${String(currentNo).padStart(3, '0')}`,
        marginL,
        stageH - 90,
        fSize * 1.0
    );

    drawStyledText(
        `Status: ${arucoStatusText}`,
        marginL,
        stageH - 40,
        fSize * 0.7
    );

    // ===== ポイント描画 =====

    Object.values(points).forEach(p => {

        ctx.strokeStyle = "red";
        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.arc(
            ox + p.x * scale,
            oy + p.y * scale,
            15,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        drawStyledText(
            p.label,
            ox + p.x * scale + 20,
            oy + p.y * scale - 20,
            fSize * 0.4
        );
    });

    // ===== 拡大鏡 =====

    if (activePoint && isHolding) {
        drawMagnifier(
            ox,
            oy,
            scale,
            isWarped ? warpedCanvas : lastCapturedFrame
        );
    }
}

function drawStyledText(t, x, y, s) {

    ctx.font = `bold ${s}px sans-serif`;

    ctx.strokeStyle = "white";
    ctx.lineWidth = 3;

    ctx.strokeText(t, x, y);

    ctx.fillStyle = "black";
    ctx.fillText(t, x, y);
}

function drawMagnifier(ox, oy, scale, sourceImg) {

    const mag = 3;

    const winW = 450;
    const winH = 250;

    const tx = (canvas.width - winW) / 2;
    const ty = 140;

    ctx.save();

    ctx.strokeStyle = "yellow";
    ctx.lineWidth = 4;

    ctx.strokeRect(tx, ty, winW, winH);

    ctx.beginPath();
    ctx.rect(tx, ty, winW, winH);
    ctx.clip();

    const srcX = activePoint.x - (winW / mag) / 2 / scale;
    const srcY = activePoint.y - (winH / mag) / 2 / scale;

    ctx.drawImage(
        sourceImg,
        srcX,
        srcY,
        (winW / mag) / scale,
        (winH / mag) / scale,
        tx,
        ty,
        winW,
        winH
    );

    const centerX = tx + winW / 2;
    const centerY = ty + winH / 2;

    ctx.strokeStyle = "red";

    ctx.beginPath();

    ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);

    ctx.stroke();

    ctx.restore();
}

// ===== 尾叉ズレ対策 =====
// エッジ検出時の最後端をそのまま採用せず、少し左へ補正

async function asyncDetect() {

    const sw = 480;
    const sh = 270;

    offscreen.width = sw;
    offscreen.height = sh;

    octx.drawImage(lastCapturedFrame, 0, 0, sw, sh);

    const data = octx.getImageData(0, 0, sw, sh).data;

    const scanY = 135;

    let allMinX = sw;
    let allMaxX = 0;

    for (let x = 10; x < sw - 10; x++) {

        const i = (scanY * sw + x) * 4;
        const prevI = (scanY * sw + (x - 4)) * 4;

        if (Math.abs(data[i] - data[prevI]) > 20) {

            if (x < allMinX) allMinX = x;
            if (x > allMaxX) allMaxX = x;
        }
    }

    if (allMaxX > allMinX + 20) {

        const scaleX = 1280 / sw;

        points.p1.x = allMinX * scaleX;

        // 重要修正
        // 尾叉はエッジ外周を拾いやすいので少し戻す
        points.p2.x = (allMaxX - 4) * scaleX;

        points.p1.y = 360;
        points.p2.y = 360;
    }
}

function finalizeAndSave() {

    const link = document.createElement('a');

    link.href = canvas.toDataURL("image/png");

    link.download =
        `水槽${tankId}_No${String(currentNo).padStart(3, '0')}.png`;

    link.click();

    currentNo++;

    toggleHold(false);
}

async function toggleHold(state) {

    isHolding = state;

    clearTimeout(testDisplayTimer);

    if (state) {

        lctx.drawImage(video, 0, 0, 1280, 720);

        if (!window.cv) {
            await loadOpenCv();
            cvReady = true;
        }

        await asyncDetect();

    } else {

        detectedArUcoPoints = [];
        globalCorners = {};

        isWarped = false;

        arucoStatusText = "ArUco: Ready";
    }

    document.getElementById('btn-ratio').style.display =
        !isHolding ? 'block' : 'none';

    document.getElementById('btn-test').style.display =
        !isHolding ? 'block' : 'none';

    document.getElementById('btn-hold').style.display =
        !isHolding ? 'block' : 'none';

    document.getElementById('btn-cancel').style.display =
        isHolding ? 'block' : 'none';

    document.getElementById('btn-save').style.display =
        isHolding ? 'block' : 'none';
}

function initTouchEvents() {

    const getPos = (e) => {

        const r = canvas.getBoundingClientRect();

        const baseW = 1280;
        const baseH = 720;

        let scale = Math.min(
            canvas.width / baseW,
            canvas.height / baseH
        );

        const ox = (canvas.width - baseW * scale) / 2;
        const oy = (canvas.height - baseH * scale) / 2;

        return {
            x: ((e.touches[0].clientX - r.left) - ox) / scale,
            y: ((e.touches[0].clientY - r.top) - oy) / scale
        };
    };

    canvas.addEventListener('touchstart', (e) => {

        if (!isHolding) return;

        const pos = getPos(e);

        activePoint = Object.values(points).find(p =>
            Math.hypot(p.x - pos.x, p.y - pos.y) < 120
        );
    });

    canvas.addEventListener('touchmove', (e) => {

        if (activePoint) {

            const pos = getPos(e);

            activePoint.x = pos.x;
            activePoint.y = pos.y;

            e.preventDefault();
        }

    }, { passive: false });

    canvas.addEventListener('touchend', () => {
        activePoint = null;
    });
}

function toggleRatioUI() {

    const val = prompt(
        "1pxあたりのmm数を入力",
        mmRatio
    );

    if (val !== null && !isNaN(val)) {
        mmRatio = parseFloat(val);
    }
}

function testArUcoNow() {
    alert("ArUcoテストは省略版");
}

</script>
</body>
</html>
